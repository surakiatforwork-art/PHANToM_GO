name: iOS CI

on:
  push:
    branches: ["main", "codex/ios-*"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "docs/web/webapp/index.html"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    name: Native iOS tests and simulator build
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Prepare native project
        run: |
          python3 scripts/prepare_configuration.py
          swift scripts/generate_icon.swift
          python3 scripts/verify_icon.py
          xcodegen generate
      - name: Select iPhone and iPad simulators
        run: |
          python3 scripts/select_simulators.py >> "$GITHUB_ENV"
      - name: Unit and iPhone UI tests
        run: |
          mkdir -p build/logs
          set -o pipefail
          xcodebuild -project PHANToMGO.xcodeproj -scheme PHANToMGO \
            -configuration Debug -destination "$IOS_PHONE_DESTINATION" \
            -derivedDataPath build/DerivedData -resultBundlePath build/iPhone-Tests.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            test | tee build/logs/iphone-tests.log
      - name: iPad UI tests
        run: |
          set -o pipefail
          xcodebuild -project PHANToMGO.xcodeproj -scheme PHANToMGO \
            -configuration Debug -destination "$IOS_PAD_DESTINATION" \
            -derivedDataPath build/DerivedData -resultBundlePath build/iPad-Tests.xcresult \
            -parallel-testing-enabled NO -only-testing:PHANToMGOUITests CODE_SIGNING_ALLOWED=NO \
            test | tee build/logs/ipad-tests.log
      - name: Package simulator app
        run: |
          mkdir -p build/artifacts
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/PHANToMGO.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/artifacts/PHANToMGO-simulator.app.zip
      - name: Export UI screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          for result in build/iPhone-Tests.xcresult build/iPad-Tests.xcresult; do
            if [[ -d "$result" ]]; then
              name="$(basename "$result" .xcresult)"
              xcrun xcresulttool export attachments --path "$result" --output-path "build/screenshots/$name" || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHANToMGO-ios-test-results
          path: |
            ios/build/logs/
            ios/build/screenshots/
            ios/build/*Tests.xcresult
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: PHANToMGO-ios-icon-preview
          path: ios/PHANToMGO/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: PHANToMGO-ios-simulator-app
          path: ios/build/artifacts/PHANToMGO-simulator.app.zip
