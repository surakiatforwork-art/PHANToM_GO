name: iOS Device Build

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: "Unsigned for Sideloadly, or signed with Apple certificates/profiles"
        required: true
        type: choice
        default: unsigned
        options:
          - unsigned
          - signed
      distribution_method:
        description: "Signed IPA export method"
        required: true
        type: choice
        default: release-testing
        options:
          - debugging
          - release-testing
          - app-store-connect

permissions:
  contents: read

concurrency:
  group: ios-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-device-ipa:
    name: Native arm64 device IPA
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ios
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      BUILD_SHARE_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_SHARE_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_IDENTIFIER: ${{ secrets.IOS_BUNDLE_IDENTIFIER || 'com.phantom.PHANToMGO' }}
      CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
      SIGNING_MODE: ${{ inputs.signing_mode }}
      EXPORT_METHOD: ${{ inputs.distribution_method }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Prepare native project
        run: |
          python3 scripts/prepare_configuration.py
          swift scripts/generate_icon.swift
          xcodegen generate
      - name: Install signing material
        if: inputs.signing_mode == 'signed'
        run: bash scripts/install_signing.sh
      - name: Build unsigned iPhoneOS app
        if: inputs.signing_mode == 'unsigned'
        run: |
          mkdir -p build/logs build/artifacts
          set -o pipefail
          xcodebuild -project PHANToMGO.xcodeproj -scheme PHANToMGO \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build/DeviceDerivedData PHANTOM_IOS_BUNDLE_ID="$IOS_BUNDLE_IDENTIFIER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build/logs/device-build.log
          APP_PATH="build/DeviceDerivedData/Build/Products/Release-iphoneos/PHANToMGO.app"
          test -d "$APP_PATH"
          mkdir -p build/package/Payload
          ditto "$APP_PATH" build/package/Payload/PHANToMGO.app
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          (cd build/package && zip -q -r "../artifacts/PHANToM_GO-iOS-v$VERSION-unsigned.ipa" Payload)
      - name: Archive and export signed IPA
        if: inputs.signing_mode == 'signed'
        run: |
          mkdir -p build/logs build/artifacts
          set -o pipefail
          EXTRA_SIGN_ARGS=()
          if [[ -n "$CODE_SIGN_IDENTITY" ]]; then EXTRA_SIGN_ARGS+=(CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY"); fi
          xcodebuild -project PHANToMGO.xcodeproj -scheme PHANToMGO \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/archive/PHANToMGO.xcarchive DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PHANTOM_IOS_BUNDLE_ID="$IOS_BUNDLE_IDENTIFIER" CODE_SIGN_STYLE=Manual \
            PHANTOM_MAIN_PROFILE="$PROFILE_NAME" PHANTOM_SHARE_PROFILE="$SHARE_PROFILE_NAME" \
            "${EXTRA_SIGN_ARGS[@]}" archive | tee build/logs/archive.log
          python3 scripts/export_options.py
          xcodebuild -exportArchive -archivePath build/archive/PHANToMGO.xcarchive \
            -exportPath build/export/output -exportOptionsPlist build/export/ExportOptions.plist \
            | tee build/logs/export.log
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/archive/PHANToMGO.xcarchive/Products/Applications/PHANToMGO.app/Info.plist)
          cp build/export/output/*.ipa "build/artifacts/PHANToM_GO-iOS-v$VERSION-signed.ipa"
      - name: Verify device binary and package
        run: python3 scripts/verify_ipa.py build/artifacts/*.ipa
      - name: Generate checksums
        run: |
          cd build/artifacts
          shasum -a 256 *.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PHANToMGO-ios-device-ipa-${{ inputs.signing_mode }}
          path: ios/build/artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHANToMGO-ios-device-build-logs
          path: ios/build/logs/
          retention-days: 7
      - name: Cleanup signing material
        if: always() && inputs.signing_mode == 'signed'
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          for uuid in "${PROFILE_UUID:-}" "${SHARE_PROFILE_UUID:-}"; do
            if [[ -n "$uuid" ]]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"; fi
          done
