name: iOS Device Build

on:
  workflow_dispatch:
    inputs:
      distribution_method:
        description: "IPA export method"
        required: true
        type: choice
        default: ad-hoc
        options:
          - development
          - ad-hoc
          - app-store

concurrency:
  group: ios-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-device-ipa:
    name: Build Signed IPA
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ios
    env:
      IOS_FIREBASE_PLIST_BASE64: ${{ secrets.IOS_FIREBASE_PLIST_BASE64 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_IDENTIFIER: ${{ secrets.IOS_BUNDLE_IDENTIFIER || 'com.phantom.PHANToMGO' }}
      CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0
          for name in IOS_FIREBASE_PLIST_BASE64 BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Prepare Firebase plist
        run: |
          python3 -c "import base64, os, pathlib; pathlib.Path('PHANToMGO/Resources/GoogleService-Info.plist').write_bytes(base64.b64decode(os.environ['IOS_FIREBASE_PLIST_BASE64']))"

      - name: Install Apple certificate and provisioning profile
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP_DIR/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP_DIR/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP_DIR/app-signing.keychain-db"

          export CERTIFICATE_PATH PROFILE_PATH KEYCHAIN_PATH
          python3 -c "import base64, os, pathlib; pathlib.Path(os.environ['CERTIFICATE_PATH']).write_bytes(base64.b64decode(os.environ['BUILD_CERTIFICATE_BASE64'])); pathlib.Path(os.environ['PROFILE_PATH']).write_bytes(base64.b64decode(os.environ['BUILD_PROVISION_PROFILE_BASE64']))"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_PLIST="$RUNNER_TEMP_DIR/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "PROFILE_UUID=$PROFILE_UUID"
          } >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project PHANToMGO.xcodeproj -scheme PHANToMGO

      - name: Create export options plist
        env:
          EXPORT_METHOD: ${{ inputs.distribution_method }}
        run: |
          mkdir -p build/export
          cat > build/export/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_IDENTIFIER}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Archive app
        run: |
          mkdir -p build/logs build/archive
          EXTRA_SIGN_ARGS=()
          if [[ -n "$CODE_SIGN_IDENTITY" ]]; then
            EXTRA_SIGN_ARGS+=(CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY")
          fi
          set -o pipefail
          xcodebuild \
            -project PHANToMGO.xcodeproj \
            -scheme PHANToMGO \
            -configuration Release \
            -archivePath build/archive/PHANToMGO.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            "${EXTRA_SIGN_ARGS[@]}" \
            archive | tee build/logs/archive.log

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/archive/PHANToMGO.xcarchive \
            -exportPath build/export/output \
            -exportOptionsPlist build/export/ExportOptions.plist | tee build/logs/export.log

      - name: Generate checksums
        run: |
          IPA_PATH="$(find build/export/output -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "IPA not found after export."
            exit 1
          fi
          shasum -a 256 "$IPA_PATH" | tee build/export/output/SHA256SUMS.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PHANToMGO-ios-device-ipa-${{ inputs.distribution_method }}
          path: |
            ios/build/export/output/*.ipa
            ios/build/export/output/SHA256SUMS.txt

      - name: Upload archive and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHANToMGO-ios-device-build-logs
          path: |
            ios/build/logs/*.log
            ios/build/export/ExportOptions.plist

      - name: Publish workflow summary
        if: always()
        run: |
          {
            echo "## iOS Device Build"
            echo ""
            echo "- Distribution method: ${{ inputs.distribution_method }}"
            echo "- Bundle identifier: ${IOS_BUNDLE_IDENTIFIER}"
            echo "- Provisioning profile: ${PROFILE_NAME}"
            echo "- Team ID: ${APPLE_TEAM_ID}"
            echo ""
            echo "Download the IPA artifact from this workflow run after completion."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing material
        if: always()
        run: |
          if [[ -n "$KEYCHAIN_PATH" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [[ -n "$PROFILE_UUID" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" || true
          fi
